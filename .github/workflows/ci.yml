name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s app -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (not pushed yet)
        run: docker build -t patient-scheduling-api:ci app
      - name: Smoke test the container
        # --read-only matches readOnlyRootFilesystem in k8s/deployment.yaml
        run: |
          docker run -d --rm --read-only -p 8000:8000 --name api patient-scheduling-api:ci
          for i in $(seq 1 15); do curl -fs http://localhost:8000/health && break || sleep 1; done
          curl -fs http://localhost:8000/health
          docker stop api
