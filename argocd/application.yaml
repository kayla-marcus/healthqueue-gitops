apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: patient-scheduling-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kayla-marcus/healthqueue-gitops.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: healthqueue
  syncPolicy:
    automated:
      prune: true      # remove cluster resources whose files are deleted from Git
      selfHeal: true   # undo manual changes made directly in the cluster
    syncOptions:
      - CreateNamespace=true
